services:
  n8n:
    image: n8nio/n8n:latest
    container_name: jobsearch-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/London
      - TZ=Europe/London
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_RUNNERS_ENABLED=true
      # Lets HTTP nodes reference {{ $env.REED_API_KEY }} etc. instead of
      # hard-coding secrets into the workflow JSON that gets committed
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Lets Code nodes require() nothing external - keeps the workflow portable
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      # n8n blocks filesystem nodes from reading paths outside this allow-list
      - N8N_RESTRICT_FILE_ACCESS_TO=/cv
    env_file:
      - .env
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows
      - ./cv:/cv:ro

volumes:
  n8n_data:
